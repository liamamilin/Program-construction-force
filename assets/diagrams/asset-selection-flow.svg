<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="构造件选择六步动作链与覆盖缺口分配图">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <marker id="arr7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <filter id="sh7" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="330" rx="14" fill="url(#bg7)"/>
  <text x="460" y="32" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">构造件选择六步动作链：从结构规格到资产分配</text>
  <text x="460" y="52" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#475569">库不是为了少写代码，而是稳定结构的可复用承接物；缺口显式分配给自写代码或胶水代码</text>

  <!-- Step 1-6 Flow (2 rows of 3) -->
  <!-- Row 1 -->
  <g filter="url(#sh7)">
    <rect x="30" y="76" width="260" height="90" rx="11" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <circle cx="56" cy="102" r="14" fill="#059669"/>
    <text x="56" y="107" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="80" y="107" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">读取结构规格包</text>
    <text x="46" y="134" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#475569">输入 Part 3 五类结构 + 横向切面</text>
    <text x="46" y="153" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">先定结构，绝不凭感觉先装库</text>
  </g>
  <line x1="290" y1="121" x2="326" y2="121" stroke="#059669" stroke-width="2" marker-end="url(#arr7)"/>

  <g filter="url(#sh7)">
    <rect x="330" y="76" width="260" height="90" rx="11" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <circle cx="356" cy="102" r="14" fill="#059669"/>
    <text x="356" y="107" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="380" y="107" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">标记可复用结构</text>
    <text x="346" y="134" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#475569">区分通用模式 vs 业务特异性规则</text>
    <text x="346" y="153" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">如：API 入口通用 / 状态规则特异</text>
  </g>
  <line x1="590" y1="121" x2="626" y2="121" stroke="#059669" stroke-width="2" marker-end="url(#arr7)"/>

  <g filter="url(#sh7)">
    <rect x="630" y="76" width="260" height="90" rx="11" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <circle cx="656" cy="102" r="14" fill="#059669"/>
    <text x="656" y="107" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="680" y="107" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">列出候选构造件</text>
    <text x="646" y="134" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#475569">查附录 C/D/E 为每类结构列 2–3 候选</text>
    <text x="646" y="153" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">例如：Zustand / Redux / Pinia</text>
  </g>

  <!-- Connector Row 1 -> Row 2 -->
  <path d="M 760 166 L 760 190 L 160 190 L 160 208" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- Row 2 -->
  <g filter="url(#sh7)">
    <rect x="30" y="212" width="260" height="94" rx="11" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
    <circle cx="56" cy="238" r="14" fill="#0891b2"/>
    <text x="56" y="243" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="80" y="243" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">验证结构覆盖范围</text>
    <text x="46" y="270" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#475569">核对构造件能承接的规格边界</text>
    <text x="46" y="289" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">未覆盖项标为显式“缺口”</text>
  </g>
  <line x1="290" y1="259" x2="326" y2="259" stroke="#059669" stroke-width="2" marker-end="url(#arr7)"/>

  <g filter="url(#sh7)">
    <rect x="330" y="212" width="260" height="94" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="356" cy="238" r="14" fill="#d97706"/>
    <text x="356" y="243" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="380" y="243" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">记录能力缺口</text>
    <text x="346" y="270" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#475569">区分：业务特异性缺口 / 连接性缺口</text>
    <text x="346" y="289" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">构造件不替代业务语义与跨层连接</text>
  </g>
  <line x1="590" y1="259" x2="626" y2="259" stroke="#059669" stroke-width="2" marker-end="url(#arr7)"/>

  <g filter="url(#sh7)">
    <rect x="630" y="212" width="260" height="94" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="656" cy="238" r="14" fill="#4f46e5"/>
    <text x="656" y="243" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text>
    <text x="680" y="243" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#3730a3">分配自写 / 胶水代码</text>
    <text x="646" y="270" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#1e293b">• 业务缺口 → 自写核心代码</text>
    <text x="646" y="289" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#1e293b">• 连接缺口 → 6 类胶水代码</text>
  </g>
</svg>
