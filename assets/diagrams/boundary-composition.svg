<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-label="边界结构与前后端分层组合架构图">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arr6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <filter id="sh6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="350" rx="14" fill="url(#bg6)"/>
  <text x="460" y="32" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">边界结构与分层组合架构（Boundary &amp; Composition）</text>
  <text x="460" y="52" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#475569">数据穿越 UI、API、数据存储与外部服务四类边界，各层通过清晰契约和适配器解耦</text>

  <!-- Frontend Column -->
  <g filter="url(#sh6)">
    <rect x="24" y="76" width="236" height="244" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="24" y="76" width="236" height="34" rx="10" fill="#0284c7"/>
    <rect x="24" y="98" width="236" height="12" fill="#0284c7"/>
    <text x="142" y="98" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">前端组件树（UI 边界）</text>

    <rect x="42" y="124" width="200" height="34" rx="7" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="142" y="145" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#0369a1">App / Layout（壳与导航）</text>

    <rect x="42" y="168" width="200" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="142" y="187" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">页面层（Pages）</text>
    <text x="142" y="204" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#64748b">TaskList · TaskDetail · CreateTask</text>

    <rect x="42" y="222" width="200" height="40" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="142" y="246" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#334155">表单与组件（RHF + Zod 校验）</text>

    <rect x="42" y="272" width="200" height="34" rx="7" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="142" y="293" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#3730a3">API Client + TanStack Query</text>
  </g>

  <!-- API Boundary Arrow -->
  <line x1="260" y1="198" x2="322" y2="198" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr6)"/>
  <rect x="266" y="164" width="54" height="24" rx="6" fill="#4f46e5"/>
  <text x="293" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#ffffff">JSON</text>
  <text x="293" y="216" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#475569">API 边界</text>

  <!-- Backend Column -->
  <g filter="url(#sh6)">
    <rect x="326" y="76" width="320" height="244" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="326" y="76" width="320" height="34" rx="10" fill="#4f46e5"/>
    <rect x="326" y="98" width="320" height="12" fill="#4f46e5"/>
    <text x="486" y="98" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">后端分层模块（组合结构）</text>

    <rect x="346" y="124" width="280" height="42" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="486" y="142" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#3730a3">API 边界层（routers/ + schemas/）</text>
    <text x="486" y="158" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#4338ca">FastAPI 路由 · Pydantic 契约校验 · 鉴权依赖</text>

    <rect x="346" y="176" width="280" height="46" rx="8" fill="#dcfce7" stroke="#6ee7b7"/>
    <text x="486" y="196" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#047857">业务服务层（services/ · 自写核心）</text>
    <text x="486" y="213" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#065f46">TaskService · 领域规则 · 状态转移验证</text>

    <rect x="346" y="232" width="134" height="72" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="413" y="256" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">数据访问层</text>
    <text x="413" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#92400e">repositories/</text>
    <text x="413" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#78350f">SQLAlchemy ORM</text>

    <rect x="492" y="232" width="134" height="72" rx="8" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="559" y="256" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#be123c">外部适配器层</text>
    <text x="559" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#9f1239">adapters/</text>
    <text x="559" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#881337">重试 · 超时 · 降级</text>
  </g>

  <!-- Right Storage & External Boundaries -->
  <line x1="646" y1="150" x2="706" y2="132" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="646" y1="220" x2="706" y2="220" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="646" y1="276" x2="706" y2="290" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr6)"/>

  <g filter="url(#sh6)">
    <rect x="710" y="88" width="186" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="803" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">数据边界（DB）</text>
    <text x="803" y="136" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">PostgreSQL · 事务持久化</text>
  </g>

  <g filter="url(#sh6)">
    <rect x="710" y="176" width="186" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="803" y="202" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">缓存与队列边界</text>
    <text x="803" y="224" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">Redis · Celery（按需扩展）</text>
  </g>

  <g filter="url(#sh6)">
    <rect x="710" y="264" width="186" height="56" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1.8"/>
    <text x="803" y="288" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#be123c">外部服务与观测边界</text>
    <text x="803" y="307" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">邮件通知 · OpenTelemetry 日志</text>
  </g>
</svg>
