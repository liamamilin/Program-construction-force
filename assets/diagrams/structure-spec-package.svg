<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-label="结构规格包：五类结构与约束可靠性横向切面架构图">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="sh4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="350" rx="14" fill="url(#bg4)"/>
  <text x="460" y="32" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">结构规格包（Structure Specification Package）</text>
  <text x="460" y="52" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#475569">五类正交结构 + 贯穿全部结构的约束与可靠性横向切面</text>

  <!-- 5 Vertical Pillar Cards -->
  <g filter="url(#sh4)">
    <rect x="26" y="74" width="164" height="172" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="26" y="74" width="164" height="32" rx="9" fill="#0284c7"/>
    <rect x="26" y="94" width="164" height="12" fill="#0284c7"/>
    <text x="108" y="95" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. 领域结构</text>
    <text x="108" y="128" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#0284c7">有什么事物？</text>
    <text x="108" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 对象卡片</text>
    <text x="108" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 字段说明</text>
    <text x="108" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 对象关系</text>
    <text x="108" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 生命周期</text>
    <text x="108" y="234" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#94a3b8">来源：需求名词</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="202" y="74" width="164" height="172" rx="11" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="202" y="74" width="164" height="32" rx="9" fill="#059669"/>
    <rect x="202" y="94" width="164" height="12" fill="#059669"/>
    <text x="284" y="95" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. 交互结构</text>
    <text x="284" y="128" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#059669">谁能做什么？</text>
    <text x="284" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 用户动作表</text>
    <text x="284" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 系统事件表</text>
    <text x="284" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 命令与查询</text>
    <text x="284" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 交互流程</text>
    <text x="284" y="234" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#94a3b8">来源：需求动词</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="378" y="74" width="164" height="172" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="378" y="74" width="164" height="32" rx="9" fill="#d97706"/>
    <rect x="378" y="94" width="164" height="12" fill="#d97706"/>
    <text x="460" y="95" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. 状态结构</text>
    <text x="460" y="128" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#d97706">什么会变化？</text>
    <text x="460" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 业务状态</text>
    <text x="460" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• UI / 请求状态</text>
    <text x="460" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 缓存状态</text>
    <text x="460" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 合法状态转移</text>
    <text x="460" y="234" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#94a3b8">来源：需求阶段</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="554" y="74" width="164" height="172" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="554" y="74" width="164" height="32" rx="9" fill="#7c3aed"/>
    <rect x="554" y="94" width="164" height="12" fill="#7c3aed"/>
    <text x="636" y="95" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4. 边界结构</text>
    <text x="636" y="128" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#7c3aed">数据从哪进出？</text>
    <text x="636" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• API 边界契约</text>
    <text x="636" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• UI 表单边界</text>
    <text x="636" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 数据存储边界</text>
    <text x="636" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 外部服务边界</text>
    <text x="636" y="234" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#94a3b8">来源：需求交互点</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="730" y="74" width="164" height="172" rx="11" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="730" y="74" width="164" height="32" rx="9" fill="#4f46e5"/>
    <rect x="730" y="94" width="164" height="12" fill="#4f46e5"/>
    <text x="812" y="95" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5. 组合结构</text>
    <text x="812" y="128" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="600" fill="#4f46e5">各部分如何组织？</text>
    <text x="812" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 前端组件树</text>
    <text x="812" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 后端模块分层</text>
    <text x="812" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 服务职责划分</text>
    <text x="812" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">• 适配器结构</text>
    <text x="812" y="234" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#94a3b8">来源：系统分层组织</text>
  </g>

  <!-- Cross-cutting Slice Bar -->
  <g filter="url(#sh4)">
    <rect x="26" y="264" width="868" height="66" rx="11" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="460" y="289" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#be123c">横向切面：约束与可靠性切面（Constraint &amp; Reliability Slice）</text>
    <text x="460" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.8" fill="#881337">字段验证  ·  角色权限  ·  合法转移约束  ·  超时/重试/降级/熔断  ·  契约测试与观测日志</text>
  </g>
</svg>
