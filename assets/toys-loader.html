<script>
  (function () {
    function boot() {
      if (window.PCFToys && typeof window.PCFToys.mountAll === "function") {
        window.PCFToys.mountAll();
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
</script>
